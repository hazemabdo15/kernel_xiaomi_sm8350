name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Fix Git Safety
      run: git config --global --add safe.directory /github/workspace

    - name: Set up MemKernel as a module (M-OUT) with specified name
      run: |
        curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M hazem

    # FIX: Merge the device specific config (Vili) into the base config (Lahaina)
    - name: Merge Configs
      run: |
        # Append the Xiaomi 11T Pro (Vili) fragment to the main Snapdragon 888 (Lahaina) defconfig
        cat arch/arm64/configs/vendor/vili_QGKI.config >> arch/arm64/configs/vendor/lahaina-qgki_defconfig
        
        # Verify it worked by checking for one of the missing symbols
        grep "CONFIG_MI_DISP" arch/arm64/configs/vendor/lahaina-qgki_defconfig || echo "Warning: Config merge might have failed"

    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: Loganysl
      with:
        arch: arm64
        compiler: clang/12
        defconfig: vendor/lahaina-qgki_defconfig
        image: Image.gz-dtb

    - name: Upload Kernel and Module
      uses: actions/upload-artifact@v4
      with:
        name: moduleandkernel
        path: |
          ${{ steps.build.outputs.outfile }}
          ./out/drivers/memkernel/memkernel.ko
