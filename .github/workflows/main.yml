name: Build Kernel + Custom Driver Hack

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: 1. Checkout Kernel Source
      uses: actions/checkout@v3
      with:
        ref: vili_ksu-302
        submodules: recursive
        fetch-depth: 0
        path: kernel_source  # Clean separation of folders

    - name: 2. Checkout Your Driver Source
      uses: actions/checkout@v3
      with:
        repository: hazemabdo15/Kernel_driver_hack
        path: driver_source

    - name: 3. Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev bc wget python3

    - name: 4. Download Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: 5. Configure & Build Kernel
      run: |
        # Setup Environment
        export PATH=$(pwd)/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        cd kernel_source
        
        # A. Clean
        make O=../out clean
        
        # B. Load Config (Merging Base + Vili + Consolidate)
        echo "Loading Configuration..."
        make O=../out vendor/lahaina-qgki_defconfig
        
        echo "Merging Vili Specifics..."
        ./scripts/kconfig/merge_config.sh -O ../out -m ../out/.config arch/arm64/configs/vendor/vili_QGKI.config
        
        if [ -f "arch/arm64/configs/vendor/lahaina_consolidate.config" ]; then
            echo "Merging Performance Config..."
            ./scripts/kconfig/merge_config.sh -O ../out -m ../out/.config arch/arm64/configs/vendor/lahaina_consolidate.config
        fi
        
        make O=../out olddefconfig

        # C. Enable KSU (Optional but recommended)
        ./scripts/config --file ../out/.config -e CONFIG_KSU
        ./scripts/config --file ../out/.config -e CONFIG_KSU_SUSFS

        # D. BUILD THE KERNEL
        # We need to build the modules first to generate Module.symvers
        echo "Building Kernel..."
        make O=../out -j$(nproc --all) Image dtbo.img modules

    - name: 6. Build Your Custom Driver (The Magic Step)
      run: |
        export PATH=$(pwd)/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CC=clang
        export LD=ld.lld
        
        # Verify directories
        KERNEL_SRC=$(pwd)/kernel_source
        OUT_DIR=$(pwd)/out
        DRIVER_SRC=$(pwd)/driver_source/kernel
        
        echo "Building External Driver against our fresh Kernel..."
        
        # Command explanation:
        # -C $KERNEL_SRC : Use the kernel's makefile
        # O=$OUT_DIR     : Use the specific build output we just created (contains the vermagic)
        # M=$DRIVER_SRC  : Point to your driver folder
        
        make -C $KERNEL_SRC O=$OUT_DIR M=$DRIVER_SRC modules

    - name: 7. Package Everything
      run: |
        mkdir -p release/modules
        
        # 1. The Kernel Image (Flash this!)
        cp out/arch/arm64/boot/Image release/
        cp out/arch/arm64/boot/dtbo.img release/
        
        # 2. Your Custom Driver (This is the file you want!)
        # It will be inside the driver source folder after compilation
        find driver_source -name "*.ko" -exec cp {} release/modules/ \;
        
        # 3. Standard Kernel Drivers (Wifi, Audio, etc)
        find out/drivers -name "*.ko" -exec cp {} release/modules/ \;
        find out/techpack -name "*.ko" -exec cp {} release/modules/ \;

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Vili_Kernel_With_Custom_Driver
        path: release/
