name: Build Kernel + Custom Driver Hack (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: 1. Checkout Kernel Source
      uses: actions/checkout@v3
      with:
        ref: vili_ksu-302
        submodules: recursive
        fetch-depth: 0
        path: kernel_source

    - name: 2. Checkout Your Driver Source
      uses: actions/checkout@v3
      with:
        repository: hazemabdo15/Kernel_driver_hack
        path: driver_source

    - name: 3. Install Build Tools
      run: |
        sudo apt-get update
        # Added 'gcc-aarch64-linux-gnu' to fix missing compiler errors
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev bc wget python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: 4. Download Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: 5. Configure & Build Kernel
      run: |
        export PATH=$(pwd)/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        cd kernel_source
        
        # FIX: Do not run 'make clean'. The folder is already empty.
        # Just ensure the output directory exists.
        mkdir -p ../out
        
        echo "Loading Configuration..."
        # Added LLVM=1 to force Clang usage
        make O=../out LLVM=1 vendor/lahaina-qgki_defconfig
        
        echo "Merging Vili Specifics..."
        ./scripts/kconfig/merge_config.sh -O ../out -m ../out/.config arch/arm64/configs/vendor/vili_QGKI.config
        
        if [ -f "arch/arm64/configs/vendor/lahaina_consolidate.config" ]; then
            echo "Merging Performance Config..."
            ./scripts/kconfig/merge_config.sh -O ../out -m ../out/.config arch/arm64/configs/vendor/lahaina_consolidate.config
        fi
        
        make O=../out LLVM=1 olddefconfig

        # Enable KSU
        ./scripts/config --file ../out/.config -e CONFIG_KSU
        ./scripts/config --file ../out/.config -e CONFIG_KSU_SUSFS

        echo "Building Kernel..."
        make O=../out LLVM=1 -j$(nproc --all) Image dtbo.img modules

    - name: 6. Build Your Custom Driver
      run: |
        export PATH=$(pwd)/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CC=clang
        export LD=ld.lld
        
        KERNEL_SRC=$(pwd)/kernel_source
        OUT_DIR=$(pwd)/out
        DRIVER_SRC=$(pwd)/driver_source/kernel
        
        echo "Building External Driver..."
        # Added LLVM=1 here as well
        make -C $KERNEL_SRC O=$OUT_DIR M=$DRIVER_SRC LLVM=1 modules

    - name: 7. Package Everything
      run: |
        mkdir -p release/modules
        
        cp out/arch/arm64/boot/Image release/
        cp out/arch/arm64/boot/dtbo.img release/
        
        # Copy custom driver
        find driver_source -name "*.ko" -exec cp {} release/modules/ \;
        
        # Copy standard drivers
        find out/drivers -name "*.ko" -exec cp {} release/modules/ \;
        find out/techpack -name "*.ko" -exec cp {} release/modules/ \;

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Vili_Kernel_With_Custom_Driver
        path: release/
