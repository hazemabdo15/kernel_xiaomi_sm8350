name: Build Kernel with Driver Module

on:
  push: 
    branches: 
      - vili_ksu-302
      - main
  pull_request:
    branches: 
      - vili_ksu-302
      - main
  workflow_dispatch:

env: 
  KERNEL_VERSION:  "5.4.302"
  ARCH: arm64
  DEVICE: SM8350
  DEFCONFIG: vendor/lahaina-qgki_defconfig

jobs: 
  build-kernel-with-driver:
    runs-on:  ubuntu-22.04
    
    steps:
    - name:  Maximize build space
      uses:  easimon/maximize-build-space@master
      with: 
        remove-dotnet: true
        remove-android: true
        remove-haskell: true
        remove-codeql:  true
        remove-docker-images: true

    - name:  Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: hazemabdo15/kernel_xiaomi_sm8350
        ref: vili_ksu-302
        path: kernel
        submodules: recursive

    - name:  Checkout driver source
      uses: actions/checkout@v4
      with:
        repository: hazemabdo15/Kernel_driver_hack
        path: Kernel_driver_hack

    - name:  Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses-dev zip unzip lz4 wget git python3 ccache cpio

    - name: Setup toolchain
      run: |
        cd kernel
        mkdir -p toolchain
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r498229.tar.gz -O clang. tar.gz
        mkdir -p toolchain/clang
        tar -xzf clang.tar.gz -C toolchain/clang
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/gcc-arm64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain/gcc-arm32
        echo "CLANG_PATH=$(pwd)/toolchain/clang/bin" >> $GITHUB_ENV
        echo "GCC_PATH=$(pwd)/toolchain/gcc-arm64/bin" >> $GITHUB_ENV
        echo "GCC32_PATH=$(pwd)/toolchain/gcc-arm32/bin" >> $GITHUB_ENV

    - name: Integrate driver
      run: |
        cd kernel
        ln -sf ../../Kernel_driver_hack/kernel drivers/khack
        grep -q "khack" drivers/Makefile || echo 'obj-$(CONFIG_KERNEL_HACK) += khack/' >> drivers/Makefile
        grep -q "khack" drivers/Kconfig || sed -i '/endmenu/i source "drivers/khack/Kconfig"' drivers/Kconfig

    - name: Configure kernel
      run: |
        cd kernel
        export PATH="${CLANG_PATH}:${GCC_PATH}:${GCC32_PATH}:${PATH}"
        make ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- O=out vendor/lahaina-qgki_defconfig
        ./scripts/config --file out/.config --module KERNEL_HACK
        make ARCH=arm64 CC=clang LLVM=1 O=out olddefconfig

    - name: Build kernel
      run: |
        cd kernel
        export PATH="${CLANG_PATH}:${GCC_PATH}:${GCC32_PATH}:${PATH}"
        make ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- O=out -j$(nproc) Image dtbs modules

    - name: Extract driver module
      run: |
        cd kernel
        find out -name "my_driver. ko" -exec cp {} out/my_driver.ko \;
        ls -lh out/my_driver.ko

    - name: Create AnyKernel3 script
      run: |
        cd kernel
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3
        rm -f Image *.dtb
        echo 'properties() {' > anykernel.sh
        echo 'kernel.string=Kernel with Driver by hazemabdo15' >> anykernel.sh
        echo 'do. devicecheck=1' >> anykernel.sh
        echo 'do.modules=1' >> anykernel.sh
        echo 'do.systemless=1' >> anykernel.sh
        echo 'do.cleanup=1' >> anykernel.sh
        echo 'do.cleanuponabort=0' >> anykernel.sh
        echo 'device.name1=vili' >> anykernel.sh
        echo 'device.name2=SM8350' >> anykernel.sh
        echo 'supported.versions=11-14' >> anykernel.sh
        echo 'supported.patchlevels=' >> anykernel.sh
        echo '}' >> anykernel.sh
        echo 'block=/dev/block/bootdevice/by-name/boot;' >> anykernel.sh
        echo 'is_slot_device=1;' >> anykernel.sh
        echo 'ramdisk_compression=auto;' >> anykernel.sh
        echo 'patch_vbmeta_flag=auto;' >> anykernel.sh
        echo '. tools/ak3-core. sh;' >> anykernel. sh
        echo 'dump_boot;' >> anykernel. sh
        echo 'write_boot;' >> anykernel. sh

    - name: Package flashable zip
      run: |
        cd kernel/AnyKernel3
        cp ../out/arch/arm64/boot/Image . 
        find ../out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} . \; 2>/dev/null || true
        mkdir -p modules/system/lib/modules
        cp ../out/my_driver.ko modules/system/lib/modules/
        zip -r9 ../kernel-sm8350-with-driver.zip * -x . git README.md *placeholder

    - name: Upload kernel Image
      uses: actions/upload-artifact@v4
      with: 
        name: kernel-Image-sm8350
        path: kernel/out/arch/arm64/boot/Image
        retention-days:  30

    - name: Upload driver module
      uses: actions/upload-artifact@v4
      with:
        name: my_driver-module-sm8350
        path: kernel/out/my_driver.ko
        retention-days: 30

    - name: Upload flashable zip
      uses: actions/upload-artifact@v4
      with:
        name: kernel-flashable-zip-sm8350
        path: kernel/kernel-sm8350-with-driver.zip
        retention-days: 90

    - name: Build summary
      run: |
        echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- kernel-flashable-zip-sm8350.zip - Flash via recovery" >> $GITHUB_STEP_SUMMARY
        echo "- my_driver-module-sm8350 - Standalone module" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Usage" >> $GITHUB_STEP_SUMMARY
        echo "After flashing, load driver with:" >> $GITHUB_STEP_SUMMARY
        echo "adb shell su -c insmod /system/lib/modules/my_driver.ko" >> $GITHUB_STEP_SUMMARY
