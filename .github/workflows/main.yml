name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Fix Git Safety
      run: git config --global --add safe.directory /github/workspace

    - name: Set up MemKernel as a module (M-OUT) with specified name
      run: |
        curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M hazem

    - name: Merge Configs
      run: |
        # 1. Add Xiaomi Common features
        cat arch/arm64/configs/vendor/xiaomi_QGKI.config >> arch/arm64/configs/vendor/lahaina-qgki_defconfig
        
        # 2. Add Vili (11T Pro) specific features
        cat arch/arm64/configs/vendor/vili_QGKI.config >> arch/arm64/configs/vendor/lahaina-qgki_defconfig

        # 3. Force MemKernel to be a Module
        echo "CONFIG_MEMKERNEL=m" >> arch/arm64/configs/vendor/lahaina-qgki_defconfig
        echo "CONFIG_MEMKERNEL_DRIVER=m" >> arch/arm64/configs/vendor/lahaina-qgki_defconfig

    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: Loganysl
      with:
        arch: arm64
        compiler: clang/12
        defconfig: vendor/lahaina-qgki_defconfig
        # CRITICAL FIX: 'modules' tells it to build the drivers!
        image: Image.gz-dtb modules

    # NEW STEP: Manually create the folder structure from your screenshot
    - name: Package Artifacts
      run: |
        # Create the directories
        mkdir -p final_artifact/arch/arm64/boot
        mkdir -p final_artifact/drivers
        
        # Copy the Kernel Image
        cp out/arch/arm64/boot/Image* final_artifact/arch/arm64/boot/
        
        # Find and Copy the MemKernel Module
        # We use 'find' because the .ko file might be deep inside the out folder
        find out -name "memkernel.ko" -exec cp {} final_artifact/drivers/ \;
        
        # Verify the contents match your screenshot
        echo "Final Structure:"
        ls -R final_artifact

    - name: Upload Kernel and Module
      uses: actions/upload-artifact@v4
      with:
        name: moduleandkernel
        path: final_artifact/
