name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Fix Git Safety
      run: git config --global --add safe.directory /github/workspace

    - name: Set up MemKernel as a module (M-OUT) with specified name
      run: |
        curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M hazem

    # FIX START: Manually enable the missing Xiaomi drivers
    - name: Add Xiaomi Configs
      run: |
        # Enable Xiaomi Hardware ID (Fixes get_hw_version_platform)
        echo "CONFIG_MI_UTIL=y" >> arch/arm64/configs/vendor/lahaina-qgki_defconfig
        echo "CONFIG_XIAOMI_HW_ID=y" >> arch/arm64/configs/vendor/lahaina-qgki_defconfig
        
        # Enable Xiaomi Display Features (Fixes mi_disp_register_client)
        echo "CONFIG_DRM_MI_DISP=y" >> arch/arm64/configs/vendor/lahaina-qgki_defconfig
        echo "CONFIG_MI_DISP=y" >> arch/arm64/configs/vendor/lahaina-qgki_defconfig
    # FIX END

    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: Loganysl
      with:
        arch: arm64
        compiler: clang/12
        defconfig: vendor/lahaina-qgki_defconfig
        image: Image.gz-dtb

    - name: Upload Kernel and Module
      uses: actions/upload-artifact@v4
      with:
        name: moduleandkernel
        path: |
          ${{ steps.build.outputs.outfile }}
          ./out/drivers/memkernel/memkernel.ko
