name: Build Kernel with Driver Module

on:  
  push: 
    branches: 
      - vili_ksu-302
      - main
  pull_request: 
    branches: 
      - vili_ksu-302
      - main
  workflow_dispatch:  

env: 
  KERNEL_VERSION:  "5.4.302"
  ARCH: arm64
  DEVICE: SM8350
  DEFCONFIG: vendor/lahaina-qgki_defconfig

jobs: 
  build-kernel-with-driver:
    runs-on:  ubuntu-22.04
    
    steps:
    - name:  Free up disk space
      run:  |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h

    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: hazemabdo15/kernel_xiaomi_sm8350
        ref: vili_ksu-302
        path: kernel
        submodules: true
        fetch-depth: 1

    - name: Checkout driver source
      uses: actions/checkout@v4
      with: 
        repository: hazemabdo15/Kernel_driver_hack
        path: Kernel_driver_hack
        fetch-depth:  1

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses-dev zip unzip lz4 wget git python3 ccache cpio kmod curl

    - name: Setup Clang toolchain
      working-directory: kernel
      run:  |
        mkdir -p toolchain/clang
        
        echo "Downloading Clang toolchain from alternate source..."
        wget --retry-connrefused --waitretry=1 --read-timeout=20 --timeout=15 -t 5 \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r498229.tar.gz \
          -O clang.tar.gz || \
        wget https://github.com/ZyCromerZ/Clang/releases/download/18.0.0-20231108-release/Clang-18.0.0-20231108.tar.gz \
          -O clang.tar.gz
        
        echo "Extracting Clang..."
        tar -xzf clang.tar.gz -C toolchain/clang
        rm clang.tar.gz
        
        ls -la toolchain/clang/bin/
        
        echo "CLANG_PATH=$(pwd)/toolchain/clang/bin" >> $GITHUB_ENV

    - name: Setup GCC toolchains
      working-directory: kernel
      run: |
        echo "Downloading GCC ARM64 toolchain..."
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/gcc-arm64
        
        echo "Downloading GCC ARM32 toolchain..."
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain/gcc-arm32
        
        echo "GCC_PATH=$(pwd)/toolchain/gcc-arm64/bin" >> $GITHUB_ENV
        echo "GCC32_PATH=$(pwd)/toolchain/gcc-arm32/bin" >> $GITHUB_ENV

    - name:  Verify toolchains
      working-directory: kernel
      run: |
        echo "Verifying Clang..."
        ls -la ${CLANG_PATH}/
        ${CLANG_PATH}/clang --version || echo "Clang not found"
        
        echo "Verifying GCC ARM64..."
        ls -la ${GCC_PATH}/
        ${GCC_PATH}/aarch64-linux-android-gcc --version || echo "GCC ARM64 not found"
        
        echo "Verifying GCC ARM32..."
        ls -la ${GCC32_PATH}/
        ${GCC32_PATH}/arm-linux-androideabi-gcc --version || echo "GCC ARM32 not found"

    - name:  Integrate driver
      working-directory:  kernel
      run: |
        echo "Creating symbolic link..."
        ln -sf ../Kernel_driver_hack/kernel drivers/khack
        ls -la drivers/khack
        
        echo "Modifying drivers/Makefile..."
        grep -q "khack" drivers/Makefile || echo 'obj-$(CONFIG_KERNEL_HACK) += khack/' >> drivers/Makefile
        
        echo "Modifying drivers/Kconfig..."
        grep -q "khack" drivers/Kconfig || sed -i '/endmenu/i source "drivers/khack/Kconfig"' drivers/Kconfig
        
        echo "Verifying integration..."
        tail drivers/Makefile
        grep -A2 -B2 khack drivers/Kconfig || echo "khack not in Kconfig yet"

    - name: Configure kernel
      working-directory: kernel
      run: |
        export PATH="${CLANG_PATH}: ${GCC_PATH}:${GCC32_PATH}:${PATH}"
        
        echo "Running defconfig..."
        make ARCH=arm64 \
             CC=clang \
             LLVM=1 \
             CROSS_COMPILE=aarch64-linux-android- \
             CROSS_COMPILE_ARM32=arm-linux-androideabi- \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             O=out \
             ${{ env.DEFCONFIG }}
        
        echo "Enabling driver module..."
        ./scripts/config --file out/.config --module KERNEL_HACK
        
        echo "Running olddefconfig..."
        make ARCH=arm64 \
             CC=clang \
             LLVM=1 \
             O=out \
             olddefconfig
        
        echo "Checking driver config..."
        grep KERNEL_HACK out/.config || echo "WARNING: KERNEL_HACK not in config"

    - name: Build kernel Image
      working-directory:  kernel
      run: |
        export PATH="${CLANG_PATH}:${GCC_PATH}: ${GCC32_PATH}: ${PATH}"
        
        echo "Building kernel Image..."
        make ARCH=arm64 \
             CC=clang \
             LLVM=1 \
             CROSS_COMPILE=aarch64-linux-android- \
             CROSS_COMPILE_ARM32=arm-linux-androideabi- \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             O=out \
             -j$(nproc) \
             Image
        
        ls -lh out/arch/arm64/boot/Image

    - name:  Build DTBs
      working-directory:  kernel
      run: |
        export PATH="${CLANG_PATH}:${GCC_PATH}:${GCC32_PATH}:${PATH}"
        
        echo "Building device tree blobs..."
        make ARCH=arm64 \
             CC=clang \
             LLVM=1 \
             CROSS_COMPILE=aarch64-linux-android- \
             CROSS_COMPILE_ARM32=arm-linux-androideabi- \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             O=out \
             -j$(nproc) \
             dtbs || echo "DTB build failed, continuing..."

    - name: Build modules
      working-directory: kernel
      run: |
        export PATH="${CLANG_PATH}:${GCC_PATH}:${GCC32_PATH}:${PATH}"
        
        echo "Building kernel modules..."
        make ARCH=arm64 \
             CC=clang \
             LLVM=1 \
             CROSS_COMPILE=aarch64-linux-android- \
             CROSS_COMPILE_ARM32=arm-linux-androideabi- \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             O=out \
             -j$(nproc) \
             modules
        
        echo "Listing built modules:"
        find out -name "*.ko" | head -20

    - name: Extract driver module
      working-directory: kernel
      run: |
        echo "Searching for my_driver.ko..."
        find out -name "*.ko" -path "*/drivers/khack/*"
        
        DRIVER_PATH=$(find out -name "my_driver.ko" -type f | head -n 1)
        
        if [ -z "$DRIVER_PATH" ]; then
          echo "ERROR: my_driver.ko not found!"
          echo "All .ko files in out/drivers:"
          find out/drivers -name "*.ko" 2>/dev/null || echo "No modules found"
          exit 1
        fi
        
        echo "Found driver:  $DRIVER_PATH"
        cp "$DRIVER_PATH" out/my_driver.ko
        ls -lh out/my_driver.ko
        
        MODULE_SIZE=$(stat -c%s out/my_driver.ko)
        echo "MODULE_SIZE=$MODULE_SIZE" >> $GITHUB_ENV

    - name:  Prepare AnyKernel3
      working-directory: kernel
      run: |
        echo "Cloning AnyKernel3..."
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3
        rm -f Image *.dtb
        
        echo "Creating anykernel.sh script..."
        cat > anykernel.sh << 'ENDSCRIPT'
properties() {
kernel.string=Kernel with Driver by hazemabdo15
do.devicecheck=1
do.modules=1
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=vili
device.name2=SM8350
supported.versions=11-14
supported.patchlevels=
}
block=/dev/block/bootdevice/by-name/boot
is_slot_device=1
ramdisk_compression=auto
patch_vbmeta_flag=auto
.  tools/ak3-core.sh
dump_boot
write_boot
ENDSCRIPT
        
        chmod 755 anykernel.sh

    - name: Package flashable zip
      working-directory: kernel/AnyKernel3
      run: |
        echo "Copying kernel Image..."
        cp ../out/arch/arm64/boot/Image . 
        ls -lh Image
        
        echo "Copying DTBs..."
        find ../out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} . \; 2>/dev/null || echo "No DTBs to copy"
        
        echo "Creating module directory..."
        mkdir -p modules/system/lib/modules
        
        echo "Copying driver module..."
        cp ../out/my_driver.ko modules/system/lib/modules/
        ls -lh modules/system/lib/modules/my_driver.ko
        
        echo "Creating flashable zip..."
        zip -r9 ../kernel-sm8350-with-driver.zip * -x . git README.md *placeholder
        
        cd ..
        ls -lh kernel-sm8350-with-driver.zip

    - name: Upload kernel Image
      uses: actions/upload-artifact@v4
      with: 
        name: kernel-Image-sm8350
        path: kernel/out/arch/arm64/boot/Image
        retention-days: 30

    - name:  Upload driver module
      uses: actions/upload-artifact@v4
      with:
        name: my_driver-module-sm8350
        path: kernel/out/my_driver.ko
        retention-days: 30

    - name: Upload flashable zip
      uses: actions/upload-artifact@v4
      with:
        name: kernel-flashable-zip-sm8350
        path:  kernel/kernel-sm8350-with-driver.zip
        retention-days: 90

    - name: Build summary
      run:  |
        echo "## Build Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Info" >> $GITHUB_STEP_SUMMARY
        echo "- Device:  Xiaomi SM8350 (VILI)" >> $GITHUB_STEP_SUMMARY
        echo "- Kernel: ${{ env.KERNEL_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- Module Size: ${{ env.MODULE_SIZE }} bytes" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Download Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "1. **kernel-flashable-zip-sm8350** - Flash this via TWRP/OrangeFox" >> $GITHUB_STEP_SUMMARY
        echo "2. **my_driver-module-sm8350** - Standalone driver module" >> $GITHUB_STEP_SUMMARY
        echo "3. **kernel-Image-sm8350** - Raw kernel Image" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### How to Use" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "# 1. Flash the zip via recovery" >> $GITHUB_STEP_SUMMARY
        echo "adb push kernel-sm8350-with-driver.zip /sdcard/" >> $GITHUB_STEP_SUMMARY
        echo "adb reboot recovery" >> $GITHUB_STEP_SUMMARY
        echo "# Flash in TWRP, then reboot" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# 2. Load the driver module" >> $GITHUB_STEP_SUMMARY
        echo "adb shell su -c 'insmod /system/lib/modules/my_driver.ko'" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# 3. Verify it loaded" >> $GITHUB_STEP_SUMMARY
        echo "adb shell su -c 'lsmod | grep my_driver'" >> $GITHUB_STEP_SUMMARY
        echo "adb shell su -c 'dmesg | grep KHACK'" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
