name: Kernel Build (Fix Modules & DTB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Fix Git Safety
      run: git config --global --add safe.directory /github/workspace

    - name: Setup Environment
      run: |
        curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M hazem

    - name: Merge Configs
      run: |
        cat arch/arm64/configs/vendor/xiaomi_QGKI.config >> arch/arm64/configs/vendor/lahaina-qgki_defconfig
        cat arch/arm64/configs/vendor/vili_QGKI.config >> arch/arm64/configs/vendor/lahaina-qgki_defconfig
        echo "CONFIG_MEMKERNEL=m" >> arch/arm64/configs/vendor/lahaina-qgki_defconfig
        echo "CONFIG_BUILD_ARM64_DT_OVERLAY=y" >> arch/arm64/configs/vendor/lahaina-qgki_defconfig

    - name: Build Kernel, DTBS and Modules
      uses: lemniskett/android-kernel-actions@master
      with:
        arch: arm64
        compiler: clang/12
        defconfig: vendor/lahaina-qgki_defconfig
        image: Image dtbs modules

    - name: Package Artifacts
      run: |
        mkdir -p final_artifact/arch/arm64/boot
        mkdir -p final_artifact/dtbs
        mkdir -p final_artifact/modules
        
        # 1. Copy the Kernel
        cp out/arch/arm64/boot/Image final_artifact/arch/arm64/boot/
        
        # 2. Copy ALL DTBs
        find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} final_artifact/dtbs/ \;
        
        # 3. COPY ALL MODULES (The Fix)
        # This finds every .ko file (drivers) and puts them in the modules folder
        find out -name "*.ko" -exec cp {} final_artifact/modules/ \;

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: complete_kernel_package
        path: final_artifact/
